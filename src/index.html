<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <!-- 영역 A: 헤더 -->
    <header class="board-header">
      <div class="board-title">
        <h1>Study Planner</h1>
        <p class="board-date" id="today-date"></p>
      </div>
      <!-- 진도 카드 (Day 13 활성화 - FR-08) -->
      <div class="progress-card" id="progress-card">
        <!-- 내용은 app.js의 renderProgressCard()에서 동적 생성 -->
      </div>
    </header>

    <!-- 영역 B: 입력 -->
    <section class="board-input">
      <input type="text" id="task-title-input"
             placeholder="학습 항목을 입력하세요... (Enter로 추가)" autocomplete="off">
      <input type="text" id="task-subject-input"
             placeholder="과목 (선택)" autocomplete="off">
      <button id="add-task-button" disabled>추가</button>
    </section>

    <!-- 영역 C: 필터 (Day 12) -->
    <section class="board-filter" id="filter-area"></section>

    <!-- 영역 D: 항목 목록 -->
    <section class="board-list">
      <ul id="task-list"></ul>
      <p id="empty-state" class="empty-state">
        오늘 학습할 내용을 추가해보세요
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
